name: Code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight check dependencies
        run: |
          python -m pip install setuptools wheel numpy==1.26.4 pycocotools==2.0.11 ruff==0.15.17
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test metrics and cache invalidation
        run: python -m unittest discover -s tests -v

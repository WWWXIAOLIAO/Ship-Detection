[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-detection"
version = "0.1.0"
description = "Reproducible YOLO11 ship detection and frozen CLIP text-prior experiments"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26.4,<2", "Pillow>=11.3,<12", "PyYAML>=6,<7",
  "torch>=2.6", "torchvision>=0.21",
  "ultralytics==8.3.228", "open_clip_torch==3.2.0",
  "pycocotools==2.0.11", "polars>=1.35,<2",
  "opencv-python>=4.11,<4.12", "ftfy>=6.3,<7",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9", "pandas>=2.2"]

[project.scripts]
ship-detect = "ship_detection.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"src/ship_detection/core.py" = ["F401"]
